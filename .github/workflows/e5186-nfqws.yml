name: E5186 NFQWS ARM test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build patched nfqws for Huawei E5186
    runs-on: ubuntu-latest

    steps:

      - name: Download official zapret v72.13 source
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/src"

          wget -qO "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            "https://github.com/bol-van/zapret/archive/refs/tags/v72.13.tar.gz"

          tar -xzf "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            -C "$GITHUB_WORKSPACE/src"

          test -d "$GITHUB_WORKSPACE/src/zapret-72.13"

          mv "$GITHUB_WORKSPACE/src/zapret-72.13" \
             "$GITHUB_WORKSPACE/zapret"

          test -f "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

          echo "===== SOURCE READY ====="
          ls -lh "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

      - name: Patch nfqws for old Linux 2.6.36
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("nfq/nfqws.c")
          s = p.read_text()

          pos = s.find("nfq_unbind_pf(*h, AF_INET)")
          if pos < 0:
              raise SystemExit("nfq_unbind_pf(*h, AF_INET) NOT FOUND")

          start = max(0, pos - 500)
          end = min(len(s), pos + 700)

          print("===== ORIGINAL CODE =====")
          print(s[start:end])
          print("===== END ORIGINAL CODE =====")

          pattern = re.compile(
              r'''(?P<indent>\s*)if\s*\(\s*nfq_unbind_pf\(\*h,\s*AF_INET\)\s*<\s*0\s*\)\s*\{\s*
              DLOG_PERROR\("nfq_unbind_pf\(\)"\);\s*
              goto\s+exiterr;\s*
              \}''',
              re.MULTILINE | re.VERBOSE
          )

          m = pattern.search(s)

          if not m:
              raise SystemExit(
                  "Could not locate nfq_unbind_pf error block. "
                  "The source layout differs from the expected v72.13 code."
              )

          indent = m.group("indent")

          replacement = (
              f'{indent}if (nfq_unbind_pf(*h, AF_INET) < 0) {{\n'
              f'{indent}    if (errno == EINVAL) {{\n'
              f'{indent}        DLOG("nfq_unbind_pf(): EINVAL, ignoring for old kernel\\n");\n'
              f'{indent}    }} else {{\n'
              f'{indent}        DLOG_PERROR("nfq_unbind_pf()");\n'
              f'{indent}        goto exiterr;\n'
              f'{indent}    }}\n'
              f'{indent}}}'
          )

          s2 = s[:m.start()] + replacement + s[m.end():]

          p.write_text(s2)

          print("PATCH APPLIED")

          pos2 = s2.find("nfq_unbind_pf(*h, AF_INET)")
          print("===== PATCHED CODE =====")
          print(s2[max(0, pos2-300):pos2+700])
          print("===== END PATCHED CODE =====")
          PY

      - name: Install ARM build tools
        shell: bash
        run: |
          set -eux

          sudo apt-get update -qq
          sudo apt-get install -y libcap-dev

          mkdir -p "$HOME/tools"

          wget -qO- \
            "https://github.com/bol-van/musl-cross/releases/download/latest/armv6-unknown-linux-musleabi.tar.xz" \
            | tar -C "$HOME/tools" -xJ

          TOOLCHAIN="$HOME/tools/armv6-unknown-linux-musleabi/bin"

          test -x "$TOOLCHAIN/armv6-unknown-linux-musleabi-gcc"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          "$TOOLCHAIN/armv6-unknown-linux-musleabi-gcc" --version

      - name: Build dependencies
        shell: bash
        run: |
          set -eux

          DEPS_DIR="$GITHUB_WORKSPACE/deps"
          TARGET="armv6-unknown-linux-musleabi"
          CPU="-mcpu=arm1176jzf-s -mthumb"

          mkdir -p "$DEPS_DIR"

          echo "===== libmnl ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2" \
            | tar -xj

          (
            cd libmnl-1.0.5

            CFLAGS="-Oz $CPU -flto=auto" \
            ./configure \
              --prefix= \
              --host="$TARGET" \
              --enable-static \
              --disable-shared \
              --disable-dependency-tracking

            make -j"$(nproc)"
            make install DESTDIR="$DEPS_DIR"
          )

          echo "===== libnfnetlink ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libnfnetlink/libnfnetlink-1.0.2.tar.bz2" \
            | tar -xj

          (
            cd libnfnetlink-1.0.2

            CFLAGS="-Oz $CPU -flto=auto" \
            ./configure \
              --prefix= \
              --host="$TARGET" \
              --enable-static \
              --disable-shared \
              --disable-dependency-tracking

            make -j"$(nproc)"
            make install DESTDIR="$DEPS_DIR"
          )

          echo "===== libnetfilter_queue ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libnetfilter_queue/libnetfilter_queue-1.0.5.tar.bz2" \
            | tar -xj

          (
            cd libnetfilter_queue-1.0.5

            CFLAGS="-Oz $CPU -flto=auto" \
            ./configure \
              --prefix= \
              --host="$TARGET" \
              --enable-static \
              --disable-shared \
              --disable-dependency-tracking

            make -j"$(nproc)"
            make install DESTDIR="$DEPS_DIR"
          )

          echo "===== zlib ====="

          wget -qO- \
            "https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz" \
            | tar -xz

          (
            cd zlib-1.3.1

            CFLAGS="-Oz $CPU -flto=auto" \
              ./configure --prefix= --static

            make -j"$(nproc)"
            make install DESTDIR="$DEPS_DIR"
          )

          install -Dm644 \
            /usr/include/x86_64-linux-gnu/sys/queue.h \
            "$DEPS_DIR/include/sys/queue.h"

          install -Dm644 \
            /usr/include/sys/capability.h \
            "$DEPS_DIR/include/sys/capability.h"

      - name: Build patched nfqws
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          TARGET="armv6-unknown-linux-musleabi"
          DEPS_DIR="$GITHUB_WORKSPACE/deps"
          CPU="-mcpu=arm1176jzf-s -mthumb"

          export CC="$TARGET-gcc"
          export LD="$TARGET-ld"
          export AR="$TARGET-ar"
          export NM="$TARGET-nm"
          export STRIP="$TARGET-strip"

          export PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig"

          echo "===== BUILD ====="

          CFLAGS="-Oz"
          CFLAGS="$CFLAGS $CPU"
          CFLAGS="$CFLAGS -static"
          CFLAGS="$CFLAGS -static-libgcc"
          CFLAGS="$CFLAGS -I$DEPS_DIR/include"

          LDFLAGS="-L$DEPS_DIR/lib"

          make -C nfq clean || true

          make -C nfq -j"$(nproc)" \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS"

          test -f nfq/nfqws

          echo "===== FILE ====="
          file nfq/nfqws

          echo "===== ELF ====="
          "$TARGET-readelf" -h nfq/nfqws

          echo "===== SIZE ====="
          ls -lh nfq/nfqws

          echo "===== SHA256 ====="
          sha256sum nfq/nfqws

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp nfq/nfqws \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          "$TARGET-strip" \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo "===== FINAL BINARY ====="
          file "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"
          ls -lh "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"
          sha256sum "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

      - name: Upload patched nfqws
        uses: actions/upload-artifact@v4
        with:
          name: nfqws-e5186-v72.13
          path: output/nfqws-e5186-v72.13
          if-no-files-found: error
