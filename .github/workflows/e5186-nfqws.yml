name: E5186 NFQWS ARM test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build patched nfqws for Huawei E5186
    runs-on: ubuntu-latest

    steps:

      - name: Download official zapret v72.13 source
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/src"

          wget -qO "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            "https://github.com/bol-van/zapret/archive/refs/tags/v72.13.tar.gz"

          tar -xzf "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            -C "$GITHUB_WORKSPACE/src"

          test -d "$GITHUB_WORKSPACE/src/zapret-72.13"

          mv \
            "$GITHUB_WORKSPACE/src/zapret-72.13" \
            "$GITHUB_WORKSPACE/zapret"

          test -f "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

          echo "===== SOURCE ====="
          ls -lh "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

      - name: Patch nfqws for old Linux 2.6.36
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("nfq/nfqws.c")
          s = p.read_text()

          pos = s.find("nfq_unbind_pf(*h, AF_INET)")

          if pos < 0:
              raise SystemExit(
                  "nfq_unbind_pf(*h, AF_INET) NOT FOUND"
              )

          print("===== ORIGINAL CODE =====")
          print(
              s[
                  max(0, pos - 350):
                  min(len(s), pos + 700)
              ]
          )
          print("===== END ORIGINAL CODE =====")

          pattern = re.compile(
              r'''(?P<indent>[ \t]*)if\s*\(\s*
              nfq_unbind_pf\(\*h,\s*AF_INET\)
              \s*<\s*0\s*\)
              \s*\{
              \s*DLOG_PERROR\("nfq_unbind_pf\(\)"\);
              \s*goto\s+exiterr;
              \s*\}''',
              re.MULTILINE | re.VERBOSE
          )

          m = pattern.search(s)

          if not m:
              raise SystemExit(
                  "Could not locate nfq_unbind_pf() error block"
              )

          indent = m.group("indent")

          replacement = (
              f'{indent}if (nfq_unbind_pf(*h, AF_INET) < 0)\\n'
              f'{indent}{{\\n'
              f'{indent}    if (errno == EINVAL)\\n'
              f'{indent}    {{\\n'
              f'{indent}        DLOG("nfq_unbind_pf(): EINVAL, ignoring for old kernel\\\\n");\\n'
              f'{indent}    }}\\n'
              f'{indent}    else\\n'
              f'{indent}    {{\\n'
              f'{indent}        DLOG_PERROR("nfq_unbind_pf()");\\n'
              f'{indent}        goto exiterr;\\n'
              f'{indent}    }}\\n'
              f'{indent}}}'
          )

          s2 = (
              s[:m.start()] +
              replacement +
              s[m.end():]
          )

          p.write_text(s2)

          print("===== PATCH APPLIED =====")

          pos2 = s2.find("nfq_unbind_pf(*h, AF_INET)")

          print(
              s2[
                  max(0, pos2 - 250):
                  min(len(s2), pos2 + 800)
              ]
          )
          PY

      - name: Install ARM build tools
        shell: bash
        run: |
          set -eux

          sudo apt-get update -qq
          sudo apt-get install -y libcap-dev

          mkdir -p "$HOME/tools"

          wget -qO- \
            "https://github.com/bol-van/musl-cross/releases/download/latest/armv6-unknown-linux-musleabi.tar.xz" \
            | tar \
                -C "$HOME/tools" \
                -xJ

          TOOLCHAIN="$HOME/tools/armv6-unknown-linux-musleabi/bin"

          test -x \
            "$TOOLCHAIN/armv6-unknown-linux-musleabi-gcc"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          "$TOOLCHAIN/armv6-unknown-linux-musleabi-gcc" \
            --version

      - name: Build dependencies
        shell: bash
        run: |
          set -eux

          DEPS_DIR="$GITHUB_WORKSPACE/deps"
          TARGET="armv6-unknown-linux-musleabi"
          CPU="-mcpu=arm1176jzf-s -mthumb"
          OPTIMIZE="-Oz"

          mkdir -p "$DEPS_DIR"

          echo "============================================================"
          echo " BUILD DEPENDENCIES"
          echo "============================================================"

          echo ""
          echo "===== libmnl ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2" \
            | tar -xj

          (
            cd libmnl-1.0.5

            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --host="$TARGET" \
                --enable-static \
                --disable-shared \
                --disable-dependency-tracking

            make -j"$(nproc)"
            make install \
              -j"$(nproc)" \
              DESTDIR="$DEPS_DIR"
          )

          sed -i \
            "s|^prefix=.*|prefix=$DEPS_DIR|g" \
            "$DEPS_DIR/lib/pkgconfig/libmnl.pc"

          echo ""
          echo "===== libnfnetlink ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libnfnetlink/libnfnetlink-1.0.2.tar.bz2" \
            | tar -xj

          (
            cd libnfnetlink-1.0.2

            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --host="$TARGET" \
                --enable-static \
                --disable-shared \
                --disable-dependency-tracking

            make -j"$(nproc)"
            make install \
              -j"$(nproc)" \
              DESTDIR="$DEPS_DIR"
          )

          sed -i \
            "s|^prefix=.*|prefix=$DEPS_DIR|g" \
            "$DEPS_DIR/lib/pkgconfig/libnfnetlink.pc"

          echo ""
          echo "===== VERIFY FILES ====="

          test -f \
            "$DEPS_DIR/lib/libmnl.a"

          test -f \
            "$DEPS_DIR/lib/libnfnetlink.a"

          test -f \
            "$DEPS_DIR/include/libmnl/libmnl.h"

          test -f \
            "$DEPS_DIR/include/libnfnetlink/libnfnetlink.h"

          ls -lh \
            "$DEPS_DIR/lib/libmnl.a" \
            "$DEPS_DIR/lib/libnfnetlink.a"

          echo ""
          echo "===== libnetfilter_queue ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libnetfilter_queue/libnetfilter_queue-1.0.5.tar.bz2" \
            | tar -xj

          (
            cd libnetfilter_queue-1.0.5

            LIBMNL_CFLAGS="-I$DEPS_DIR/include/libmnl" \
            LIBMNL_LIBS="-L$DEPS_DIR/lib -lmnl" \
            LIBNFNETLINK_CFLAGS="-I$DEPS_DIR/include/libnfnetlink" \
            LIBNFNETLINK_LIBS="-L$DEPS_DIR/lib -lnfnetlink" \
            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --host="$TARGET" \
                --enable-static \
                --disable-shared \
                --disable-dependency-tracking

            make -j"$(nproc)"
            make install \
              -j"$(nproc)" \
              DESTDIR="$DEPS_DIR"
          )

          sed -i \
            "s|^prefix=.*|prefix=$DEPS_DIR|g" \
            "$DEPS_DIR/lib/pkgconfig/libnetfilter_queue.pc"

          echo ""
          echo "===== VERIFY libnetfilter_queue ====="

          test -f \
            "$DEPS_DIR/lib/libnetfilter_queue.a"

          ls -lh \
            "$DEPS_DIR/lib/libnetfilter_queue.a"

          echo ""
          echo "===== zlib ====="

          gh api repos/madler/zlib/releases/latest \
            --jq '.tag_name' \
            | xargs -I{} \
              wget -qO- \
              "https://github.com/madler/zlib/archive/refs/tags/{}.tar.gz" \
            | tar -xz

          (
            cd zlib-*

            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --static

            make -j"$(nproc)"
            make install \
              -j"$(nproc)" \
              DESTDIR="$DEPS_DIR"
          )

          echo ""
          echo "===== headers ====="

          install -Dm644 \
            /usr/include/x86_64-linux-gnu/sys/queue.h \
            "$DEPS_DIR/include/sys/queue.h"

          install -Dm644 \
            /usr/include/sys/capability.h \
            "$DEPS_DIR/include/sys/capability.h"

          echo ""
          echo "===== DEPENDENCIES READY ====="

      - name: Build patched nfqws
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          TARGET="armv6-unknown-linux-musleabi"
          DEPS_DIR="$GITHUB_WORKSPACE/deps"
          CPU="-mcpu=arm1176jzf-s -mthumb"

          export CC="$TARGET-gcc"
          export LD="$TARGET-ld"
          export AR="$TARGET-ar"
          export NM="$TARGET-nm"
          export STRIP="$TARGET-strip"

          CFLAGS="-Oz"
          CFLAGS="$CFLAGS $CPU"
          CFLAGS="$CFLAGS -static"
          CFLAGS="$CFLAGS -static-libgcc"
          CFLAGS="$CFLAGS -I$DEPS_DIR/include"

          LDFLAGS="-L$DEPS_DIR/lib"

          echo "============================================================"
          echo " BUILD PATCHED NFQWS"
          echo "============================================================"

          make -C nfq clean || true

          make -C nfq -j"$(nproc)" \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS"

          test -f nfq/nfqws

          echo ""
          echo "===== ORIGINAL BUILT BINARY ====="

          file nfq/nfqws
          ls -lh nfq/nfqws

          echo ""
          echo "===== SHA256 BEFORE STRIP ====="

          sha256sum nfq/nfqws

          echo ""
          echo "===== CREATE FINAL BINARY ====="

          mkdir -p \
            "$GITHUB_WORKSPACE/output"

          cp \
            nfq/nfqws \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          "$STRIP" \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "===== FINAL BINARY ====="

          file \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          ls -lh \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "===== FINAL SHA256 ====="

          sha256sum \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

      - name: Upload patched nfqws
        uses: actions/upload-artifact@v4
        with:
          name: nfqws-e5186-v72.13
          path: output/nfqws-e5186-v72.13
          if-no-files-found: error
