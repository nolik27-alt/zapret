name: E5186 NFQWS ARM test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build patched nfqws for Huawei E5186
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # SOURCE
      # ========================================================

      - name: Download official zapret v72.13 source
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/src"

          wget -qO "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            "https://github.com/bol-van/zapret/archive/refs/tags/v72.13.tar.gz"

          tar -xzf \
            "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            -C "$GITHUB_WORKSPACE/src"

          test -d "$GITHUB_WORKSPACE/src/zapret-72.13"

          mv \
            "$GITHUB_WORKSPACE/src/zapret-72.13" \
            "$GITHUB_WORKSPACE/zapret"

          test -f \
            "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

          echo "============================================================"
          echo " OFFICIAL ZAPRET v72.13 SOURCE"
          echo "============================================================"

          ls -lh \
            "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

      # ========================================================
      # PATCH
      # ========================================================

      - name: Patch nfqws for old Linux 2.6.36
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("nfq/nfqws.c")
          s = p.read_text()

          needle = "nfq_unbind_pf(*h, AF_INET)"

          pos = s.find(needle)

          if pos < 0:
              raise SystemExit(
                  "ERROR: nfq_unbind_pf(*h, AF_INET) not found"
              )

          print("============================================================")
          print(" ORIGINAL NFQ CODE")
          print("============================================================")

          print(
              s[
                  max(0, pos - 300):
                  min(len(s), pos + 800)
              ]
          )

          pattern = re.compile(
              r'''
              (?P<indent>[ \t]*)
              if\s*\(
              \s*nfq_unbind_pf\(\*h,\s*AF_INET\)\s*<\s*0
              \s*\)
              \s*\{
              \s*DLOG_PERROR\("nfq_unbind_pf\(\)"\)\s*;
              \s*goto\s+exiterr\s*;
              \s*\}
              ''',
              re.MULTILINE | re.VERBOSE
          )

          m = pattern.search(s)

          if not m:
              raise SystemExit(
                  "ERROR: nfq_unbind_pf error block not found"
              )

          indent = m.group("indent")

          replacement = (
              f'{indent}if (nfq_unbind_pf(*h, AF_INET) < 0) {{\n'
              f'{indent}\tif (errno == EINVAL) {{\n'
              f'{indent}\t\tDLOG("nfq_unbind_pf(): EINVAL, ignoring for old kernel\\n");\n'
              f'{indent}\t}} else {{\n'
              f'{indent}\t\tDLOG_PERROR("nfq_unbind_pf()");\n'
              f'{indent}\t\tgoto exiterr;\n'
              f'{indent}\t}}\n'
              f'{indent}}}'
          )

          s = (
              s[:m.start()]
              + replacement
              + s[m.end():]
          )

          p.write_text(s)

          print("")
          print("============================================================")
          print(" PATCH APPLIED")
          print("============================================================")

          pos2 = s.find(needle)

          print(
              s[
                  max(0, pos2 - 250):
                  min(len(s), pos2 + 850)
              ]
          )
          PY

      # ========================================================
      # BUILD TOOLS
      # ========================================================

      - name: Set up build tools
        shell: bash
        run: |
          set -eux

          sudo apt update -qq
          sudo apt install -y libcap-dev

          TOOL=armv6-unknown-linux-musleabi

          URL="https://github.com/bol-van/musl-cross/releases/download/latest/${TOOL}.tar.xz"

          mkdir -p "$HOME/tools"

          wget -qO- "$URL" \
            | tar -C "$HOME/tools" -xJ

          test -x \
            "$HOME/tools/$TOOL/bin/$TOOL-gcc"

          echo \
            "$HOME/tools/$TOOL/bin" \
            >> "$GITHUB_PATH"

          echo "============================================================"
          echo " TOOLCHAIN"
          echo "============================================================"

          "$HOME/tools/$TOOL/bin/$TOOL-gcc" \
            --version

      # ========================================================
      # OFFICIAL-STYLE BUILD
      # ========================================================

      - name: Build zapret ARM
        shell: bash
        env:
          ARCH: arm
          TARGET: armv6-unknown-linux-musleabi
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux

          DEPS_DIR="$GITHUB_WORKSPACE/deps"

          export CC="$TARGET-gcc"
          export LD="$TARGET-ld"
          export AR="$TARGET-ar"
          export NM="$TARGET-nm"
          export STRIP="$TARGET-strip"

          export PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig"
          export STAGING_DIR="$RUNNER_TEMP"

          OPTIMIZE=-Oz
          CPU="-mcpu=arm1176jzf-s -mthumb"

          mkdir -p "$DEPS_DIR"

          echo "============================================================"
          echo " BUILD SETTINGS"
          echo "============================================================"

          echo "ARCH=$ARCH"
          echo "TARGET=$TARGET"
          echo "CPU=$CPU"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

          # ------------------------------------------------------
          # NETFILTER LIBRARIES
          # This follows the official v72.13 build order.
          # ------------------------------------------------------

          echo ""
          echo "============================================================"
          echo " DOWNLOAD NETFILTER LIBRARIES"
          echo "============================================================"

          wget -qO- \
            "https://www.netfilter.org/pub/libnfnetlink/libnfnetlink-1.0.2.tar.bz2" \
            | tar -xj

          wget -qO- \
            "https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2" \
            | tar -xj

          wget -qO- \
            "https://www.netfilter.org/pub/libnetfilter_queue/libnetfilter_queue-1.0.5.tar.bz2" \
            | tar -xj

          echo ""
          echo "============================================================"
          echo " BUILD NETFILTER LIBRARIES"
          echo "============================================================"

          for i in libmnl libnfnetlink libnetfilter_queue
          do

            echo ""
            echo "------------------------------------------------------------"
            echo "BUILDING: $i"
            echo "------------------------------------------------------------"

            (
              cd "$i"-*

              CFLAGS="$OPTIMIZE $CPU -flto=auto" \
                ./configure \
                  --prefix= \
                  --host="$TARGET" \
                  --enable-static \
                  --disable-shared \
                  --disable-dependency-tracking

              make install \
                -j"$(nproc)" \
                DESTDIR="$DEPS_DIR"
            )

            test -f \
              "$DEPS_DIR/lib/pkgconfig/$i.pc"

            sed -i \
              "s|^prefix=.*|prefix=$DEPS_DIR|g" \
              "$DEPS_DIR/lib/pkgconfig/$i.pc"

            echo ""
            echo "===== $i.pc ====="

            cat \
              "$DEPS_DIR/lib/pkgconfig/$i.pc"

          done

          echo ""
          echo "============================================================"
          echo " CHECK PKG-CONFIG"
          echo "============================================================"

          pkg-config --version

          echo ""
          echo "--- libmnl ---"
          pkg-config --modversion libmnl

          echo ""
          echo "--- libnfnetlink ---"
          pkg-config --modversion libnfnetlink

          echo ""
          echo "--- libnetfilter_queue ---"
          pkg-config --modversion libnetfilter_queue

          echo ""
          echo "============================================================"
          echo " CHECK LIBRARY FILES"
          echo "============================================================"

          test -f "$DEPS_DIR/lib/libmnl.a"
          test -f "$DEPS_DIR/lib/libnfnetlink.a"
          test -f "$DEPS_DIR/lib/libnetfilter_queue.a"

          ls -lh \
            "$DEPS_DIR/lib/libmnl.a" \
            "$DEPS_DIR/lib/libnfnetlink.a" \
            "$DEPS_DIR/lib/libnetfilter_queue.a"

          # ------------------------------------------------------
          # ZLIB
          # ------------------------------------------------------

          echo ""
          echo "============================================================"
          echo " BUILD ZLIB"
          echo "============================================================"

          gh api \
            repos/madler/zlib/releases/latest \
            --jq '.tag_name' \
            | xargs -I{} \
              wget -qO- \
              "https://github.com/madler/zlib/archive/refs/tags/{}.tar.gz" \
            | tar -xz

          (
            cd zlib-*

            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --static

            make install \
              -j"$(nproc)" \
              DESTDIR="$DEPS_DIR"
          )

          # ------------------------------------------------------
          # HEADERS
          # ------------------------------------------------------

          echo ""
          echo "============================================================"
          echo " INSTALL HEADERS"
          echo "============================================================"

          install \
            -Dm644 \
            -t "$DEPS_DIR/include/sys" \
            /usr/include/x86_64-linux-gnu/sys/queue.h \
            /usr/include/sys/capability.h

          # ------------------------------------------------------
          # BUILD ZAPRET
          # ------------------------------------------------------

          echo ""
          echo "============================================================"
          echo " BUILD PATCHED ZAPRET"
          echo "============================================================"

          CFLAGS_ZAPRET="-DZAPRET_GH_VER=v72.13-e5186"
          CFLAGS_ZAPRET="$CFLAGS_ZAPRET -DZAPRET_GH_HASH=87e058624c72863db53bdaf7fb6f16576dddb6ab"
          CFLAGS_ZAPRET="$CFLAGS_ZAPRET -static-libgcc -static"
          CFLAGS_ZAPRET="$CFLAGS_ZAPRET $CPU"
          CFLAGS_ZAPRET="$CFLAGS_ZAPRET -I$DEPS_DIR/include"

          LDFLAGS_ZAPRET="-L$DEPS_DIR/lib"

          OPTIMIZE="$OPTIMIZE" \
          CFLAGS="$CFLAGS_ZAPRET" \
          LDFLAGS="$LDFLAGS_ZAPRET" \
            make \
              -C "$GITHUB_WORKSPACE/zapret" \
              -j"$(nproc)"

          # ------------------------------------------------------
          # VERIFY
          # ------------------------------------------------------

          test -f \
            "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws"

          echo ""
          echo "============================================================"
          echo " BUILT NFQWS"
          echo "============================================================"

          file \
            "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws"

          ls -lh \
            "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws"

          echo ""
          echo "============================================================"
          echo " SHA256 BEFORE STRIP"
          echo "============================================================"

          sha256sum \
            "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws"

          # ------------------------------------------------------
          # FINAL COPY
          # ------------------------------------------------------

          mkdir -p \
            "$GITHUB_WORKSPACE/output"

          cp \
            "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws" \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          "$STRIP" \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "============================================================"
          echo " FINAL NFQWS"
          echo "============================================================"

          file \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          ls -lh \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "============================================================"
          echo " FINAL SHA256"
          echo "============================================================"

          sha256sum \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

      # ========================================================
      # ARTIFACT
      # ========================================================

      - name: Upload patched nfqws
        uses: actions/upload-artifact@v4
        with:
          name: nfqws-e5186-v72.13
          path: output/nfqws-e5186-v72.13
          if-no-files-found: error
