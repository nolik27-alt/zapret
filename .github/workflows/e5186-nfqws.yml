      - name: Build patched nfqws
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          TARGET="armv6-unknown-linux-musleabi"
          DEPS="$GITHUB_WORKSPACE/deps"
          CPU="-mcpu=arm1176jzf-s -mthumb"

          export CC="$TARGET-gcc"
          export AR="$TARGET-ar"
          export LD="$TARGET-ld"
          export NM="$TARGET-nm"
          export STRIP="$TARGET-strip"

          echo "============================================================"
          echo " PREPARE SYSTEM HEADERS"
          echo "============================================================"

          mkdir -p "$DEPS/include/sys"

          test -f /usr/include/x86_64-linux-gnu/sys/queue.h
          test -f /usr/include/sys/capability.h

          cp \
            /usr/include/x86_64-linux-gnu/sys/queue.h \
            "$DEPS/include/sys/queue.h"

          cp \
            /usr/include/sys/capability.h \
            "$DEPS/include/sys/capability.h"

          echo "sys/queue.h:"
          ls -lh "$DEPS/include/sys/queue.h"

          echo "sys/capability.h:"
          ls -lh "$DEPS/include/sys/capability.h"

          echo ""
          echo "============================================================"
          echo " CHECK NETFILTER HEADERS"
          echo "============================================================"

          test -f "$DEPS/include/libmnl/libmnl.h"
          test -f "$DEPS/include/libnfnetlink/libnfnetlink.h"
          test -f "$DEPS/include/libnetfilter_queue/libnetfilter_queue.h"

          echo "All required headers exist."

          echo ""
          echo "============================================================"
          echo " BUILD NFQWS"
          echo "============================================================"

          CFLAGS="-Oz"
          CFLAGS="$CFLAGS $CPU"
          CFLAGS="$CFLAGS -static"
          CFLAGS="$CFLAGS -static-libgcc"
          CFLAGS="$CFLAGS -I$DEPS/include"

          CPPFLAGS="-I$DEPS/include"

          LDFLAGS="-L$DEPS/lib"

          echo "CFLAGS=$CFLAGS"
          echo "CPPFLAGS=$CPPFLAGS"
          echo "LDFLAGS=$LDFLAGS"

          make -C nfq clean || true

          make -C nfq \
            CC="$CC" \
            AR="$AR" \
            LD="$LD" \
            CFLAGS="$CFLAGS" \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS"

          test -f nfq/nfqws

          echo ""
          echo "============================================================"
          echo " BUILT NFQWS"
          echo "============================================================"

          file nfq/nfqws
          ls -lh nfq/nfqws

          echo ""
          echo "===== SHA256 ====="

          sha256sum nfq/nfqws

          echo ""
          echo "===== CREATE OUTPUT ====="

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp \
            nfq/nfqws \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          "$STRIP" \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "============================================================"
          echo " FINAL BINARY"
          echo "============================================================"

          file \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          ls -lh \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "===== FINAL SHA256 ====="

          sha256sum \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"
