name: E5186 NFQWS ARM test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build patched nfqws for Huawei E5186
    runs-on: ubuntu-latest

    steps:

      - name: Download official zapret v72.13 source
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/src"

          wget -qO "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            "https://github.com/bol-van/zapret/archive/refs/tags/v72.13.tar.gz"

          tar -xzf "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            -C "$GITHUB_WORKSPACE/src"

          test -d "$GITHUB_WORKSPACE/src/zapret-72.13"

          mv "$GITHUB_WORKSPACE/src/zapret-72.13" \
             "$GITHUB_WORKSPACE/zapret"

          test -f "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

          echo "===== SOURCE READY ====="
          ls -lh "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

      - name: Patch nfqws for old Linux 2.6.36
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("nfq/nfqws.c")
          s = p.read_text()

          pos = s.find("nfq_unbind_pf(*h, AF_INET)")
          if pos < 0:
              raise SystemExit("nfq_unbind_pf(*h, AF_INET) NOT FOUND")

          print("===== ORIGINAL CODE =====")
          print(s[max(0, pos - 350):pos + 600])
          print("===== END ORIGINAL CODE =====")

          pattern = re.compile(
              r'''(?P<indent>[ \t]*)if\s*\(\s*nfq_unbind_pf\(\*h,\s*AF_INET\)\s*<\s*0\s*\)\s*
              \{
              \s*DLOG_PERROR\("nfq_unbind_pf\(\)"\);
              \s*goto\s+exiterr;
              \s*\}''',
              re.MULTILINE | re.VERBOSE
          )

          m = pattern.search(s)

          if not m:
              raise SystemExit(
                  "Could not locate nfq_unbind_pf() error block"
              )

          indent = m.group("indent")

          replacement = (
              f'{indent}if (nfq_unbind_pf(*h, AF_INET) < 0)\n'
              f'{indent}{{\n'
              f'{indent}\tif (errno == EINVAL)\n'
              f'{indent}\t{{\n'
              f'{indent}\t\tDLOG("nfq_unbind_pf(): EINVAL, ignoring for old kernel\\n");\n'
              f'{indent}\t}}\n'
              f'{indent}\telse\n'
              f'{indent}\t{{\n'
              f'{indent}\t\tDLOG_PERROR("nfq_unbind_pf()");\n'
              f'{indent}\t\tgoto exiterr;\n'
              f'{indent}\t}}\n'
              f'{indent}}}'
          )

          s2 = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s2)

          print("===== PATCH APPLIED =====")

          pos2 = s2.find("nfq_unbind_pf(*h, AF_INET)")
          print(s2[max(0, pos2 - 250):pos2 + 700])
          PY

      - name: Install ARM build tools
        shell: bash
        run: |
          set -eux

          sudo apt update -qq
          sudo apt install -y libcap-dev

          mkdir -p "$HOME/tools"

          wget -qO- \
            "https://github.com/bol-van/musl-cross/releases/download/latest/armv6-unknown-linux-musleabi.tar.xz" \
            | tar -C "$HOME/tools" -xJ

          test -x \
            "$HOME/tools/armv6-unknown-linux-musleabi/bin/armv6-unknown-linux-musleabi-gcc"

          echo \
            "$HOME/tools/armv6-unknown-linux-musleabi/bin" \
            >> "$GITHUB_PATH"

          "$HOME/tools/armv6-unknown-linux-musleabi/bin/armv6-unknown-linux-musleabi-gcc" \
            --version

      - name: Build dependencies and patched zapret
        shell: bash
        env:
          ARCH: arm
          TARGET: armv6-unknown-linux-musleabi
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux

          DEPS_DIR="$GITHUB_WORKSPACE/deps"

          export CC="$TARGET-gcc"
          export LD="$TARGET-ld"
          export AR="$TARGET-ar"
          export NM="$TARGET-nm"
          export STRIP="$TARGET-strip"

          export PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig"
          export STAGING_DIR="$RUNNER_TEMP"

          OPTIMIZE="-Oz"
          CPU="-mcpu=arm1176jzf-s -mthumb"

          mkdir -p "$DEPS_DIR"

          echo "============================================================"
          echo " BUILD NETFILTER LIBRARIES"
          echo "============================================================"
          echo "TARGET=$TARGET"
          echo "CPU=$CPU"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo ""

          echo "===== libnfnetlink ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libnfnetlink/libnfnetlink-1.0.2.tar.bz2" \
            | tar -xj

          (
            cd libnfnetlink-1.0.2

            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --host="$TARGET" \
                --enable-static \
                --disable-shared \
                --disable-dependency-tracking

            make install -j"$(nproc)" DESTDIR="$DEPS_DIR"
          )

          sed -i \
            "s|^prefix=.*|prefix=$DEPS_DIR|g" \
            "$DEPS_DIR/lib/pkgconfig/libnfnetlink.pc"

          echo "===== libmnl ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2" \
            | tar -xj

          (
            cd libmnl-1.0.5

            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --host="$TARGET" \
                --enable-static \
                --disable-shared \
                --disable-dependency-tracking

            make install -j"$(nproc)" DESTDIR="$DEPS_DIR"
          )

          sed -i \
            "s|^prefix=.*|prefix=$DEPS_DIR|g" \
            "$DEPS_DIR/lib/pkgconfig/libmnl.pc"

          echo "===== CHECK FIRST TWO LIBRARIES ====="

          PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig" \
            pkg-config --modversion libnfnetlink

          PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig" \
            pkg-config --modversion libmnl

          echo "===== libnetfilter_queue ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libnetfilter_queue/libnetfilter_queue-1.0.5.tar.bz2" \
            | tar -xj

          (
            cd libnetfilter_queue-1.0.5

            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --host="$TARGET" \
                --enable-static \
                --disable-shared \
                --disable-dependency-tracking

            make install -j"$(nproc)" DESTDIR="$DEPS_DIR"
          )

          sed -i \
            "s|^prefix=.*|prefix=$DEPS_DIR|g" \
            "$DEPS_DIR/lib/pkgconfig/libnetfilter_queue.pc"

          echo "===== CHECK ALL NETFILTER LIBRARIES ====="

          PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig" \
            pkg-config --modversion libmnl

          PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig" \
            pkg-config --modversion libnfnetlink

          PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig" \
            pkg-config --modversion libnetfilter_queue

          echo ""
          echo "===== zlib ====="

          gh api repos/madler/zlib/releases/latest --jq '.tag_name' | \
            xargs -I{} \
              wget -qO- \
              "https://github.com/madler/zlib/archive/refs/tags/{}.tar.gz" \
            | tar -xz

          (
            cd zlib-*

            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --static

            make install -j"$(nproc)" DESTDIR="$DEPS_DIR"
          )

          echo ""
          echo "===== HEADERS ====="

          install -Dm644 \
            -t "$DEPS_DIR/include/sys" \
            /usr/include/x86_64-linux-gnu/sys/queue.h \
            /usr/include/sys/capability.h

          echo ""
          echo "============================================================"
          echo " BUILD ZAPRET"
          echo "============================================================"

          CFLAGS="-DZAPRET_GH_VER=v72.13-e5186"
          CFLAGS="$CFLAGS -DZAPRET_GH_HASH=87e058624c72863db53bdaf7fb6f16576dddb6ab"
          CFLAGS="$CFLAGS -static-libgcc -static"
          CFLAGS="$CFLAGS $CPU"
          CFLAGS="$CFLAGS -I$DEPS_DIR/include"

          LDFLAGS="-L$DEPS_DIR/lib"

          OPTIMIZE="$OPTIMIZE" \
          CFLAGS="$CFLAGS" \
          LDFLAGS="$LDFLAGS" \
            make -C "$GITHUB_WORKSPACE/zapret" -j"$(nproc)"

          test -f "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws"

          echo ""
          echo "===== BUILT NFQWS ====="

          file "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws"

          ls -lh \
            "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws"

          echo ""
          echo "===== SHA256 BEFORE STRIP ====="

          sha256sum \
            "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws"

          echo ""
          echo "===== CREATE OUTPUT ====="

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp \
            "$GITHUB_WORKSPACE/zapret/binaries/my/nfqws" \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          "$STRIP" \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "===== FINAL BINARY ====="

          file \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          ls -lh \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "===== FINAL SHA256 ====="

          sha256sum \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

      - name: Upload patched nfqws
        uses: actions/upload-artifact@v4
        with:
          name: nfqws-e5186-v72.13
          path: output/nfqws-e5186-v72.13
          if-no-files-found: error
