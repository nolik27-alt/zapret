name: E5186 NFQWS ARM test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build patched nfqws for Huawei E5186
    runs-on: ubuntu-latest

    steps:

      - name: Download official zapret v72.13 source
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/src"

          wget -qO "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            "https://github.com/bol-van/zapret/archive/refs/tags/v72.13.tar.gz"

          tar -xzf "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            -C "$GITHUB_WORKSPACE/src"

          test -d "$GITHUB_WORKSPACE/src/zapret-72.13"

          mv "$GITHUB_WORKSPACE/src/zapret-72.13" \
             "$GITHUB_WORKSPACE/zapret"

          test -f "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

          echo "===== SOURCE ====="
          ls -la "$GITHUB_WORKSPACE/zapret"
          echo "===== NFQWS SOURCE ====="
          ls -lh "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

      - name: Patch nfqws for old Linux 2.6.36
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("nfq/nfqws.c")
          s = p.read_text()

          old = '''DLOG_CONDUP("unbinding existing nf_queue handler for AF_INET (if any)\\n");
          if (nfq_unbind_pf(*h, AF_INET) < 0) {
              DLOG_PERROR("nfq_unbind_pf()");
              goto exiterr;
          }
          '''

          new = '''DLOG_CONDUP("unbinding existing nf_queue handler for AF_INET (if any)\\n");
          if (nfq_unbind_pf(*h, AF_INET) < 0) {
              if (errno == EINVAL) {
                  DLOG("nfq_unbind_pf(): EINVAL, ignoring for old kernel\\n");
              } else {
                  DLOG_PERROR("nfq_unbind_pf()");
                  goto exiterr;
              }
          }
          '''

          if old not in s:
              raise SystemExit("TARGET BLOCK NOT FOUND")

          p.write_text(s.replace(old, new, 1))
          print("PATCH APPLIED")
          PY

          echo "===== PATCH CHECK ====="
          grep -n -A12 -B2 'nfq_unbind_pf' nfq/nfqws.c

      - name: Install ARM build tools
        shell: bash
        run: |
          set -eux

          sudo apt-get update -qq
          sudo apt-get install -y libcap-dev

          mkdir -p "$HOME/tools"

          wget -qO- \
            "https://github.com/bol-van/musl-cross/releases/download/latest/armv6-unknown-linux-musleabi.tar.xz" \
            | tar -C "$HOME/tools" -xJ

          test -x \
            "$HOME/tools/armv6-unknown-linux-musleabi/bin/armv6-unknown-linux-musleabi-gcc"

          echo "$HOME/tools/armv6-unknown-linux-musleabi/bin" >> "$GITHUB_PATH"

          "$HOME/tools/armv6-unknown-linux-musleabi/bin/armv6-unknown-linux-musleabi-gcc" \
            --version

      - name: Build dependencies and zapret
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux

          ARCH=arm
          TARGET=armv6-unknown-linux-musleabi
          DEPS_DIR="$GITHUB_WORKSPACE/deps"
          CPU="-mcpu=arm1176jzf-s -mthumb"
          OPTIMIZE="-Oz"

          export CC="$TARGET-gcc"
          export LD="$TARGET-ld"
          export AR="$TARGET-ar"
          export NM="$TARGET-nm"
          export STRIP="$TARGET-strip"
          export PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig"
          export STAGING_DIR="$RUNNER_TEMP"

          mkdir -p "$DEPS_DIR"

          echo "===== NETFILTER LIBS ====="

          wget -qO- \
            "https://www.netfilter.org/pub/libnfnetlink/libnfnetlink-1.0.2.tar.bz2" \
            | tar -xj

          wget -qO- \
            "https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2" \
            | tar -xj

          wget -qO- \
            "https://www.netfilter.org/pub/libnetfilter_queue/libnetfilter_queue-1.0.5.tar.bz2" \
            | tar -xj

          for i in libmnl libnfnetlink libnetfilter_queue; do
            (
              cd "$i"-*

              CFLAGS="$OPTIMIZE $CPU -flto=auto" \
              ./configure \
                --prefix= \
                --host="$TARGET" \
                --enable-static \
                --disable-shared \
                --disable-dependency-tracking

              make install -j"$(nproc)" DESTDIR="$DEPS_DIR"
            )

            sed -i \
              "s|^prefix=.*|prefix=$DEPS_DIR|g" \
              "$DEPS_DIR/lib/pkgconfig/$i.pc"
          done

          echo "===== ZLIB ====="

          TAG=$(gh api repos/madler/zlib/releases/latest --jq '.tag_name')

          wget -qO- \
            "https://github.com/madler/zlib/archive/refs/tags/${TAG}.tar.gz" \
            | tar -xz

          (
            cd zlib-*

            CFLAGS="$OPTIMIZE $CPU -flto=auto" \
            ./configure \
              --prefix= \
              --static

            make install -j"$(nproc)" DESTDIR="$DEPS_DIR"
          )

          echo "===== HEADERS ====="

          install -Dm644 \
            -t "$DEPS_DIR/include/sys" \
            /usr/include/x86_64-linux-gnu/sys/queue.h \
            /usr/include/sys/capability.h

          echo "===== BUILD ZAPRET ====="

          cd "$GITHUB_WORKSPACE/zapret"

          CFLAGS="-DZAPRET_GH_VER=v72.13-e5186"
          CFLAGS="$CFLAGS -DZAPRET_GH_HASH=87e058624c72863db53bdaf7fb6f16576dddb6ab"
          CFLAGS="$CFLAGS -static-libgcc -static"
          CFLAGS="$CFLAGS $CPU"
          CFLAGS="$CFLAGS -I$DEPS_DIR/include"

          LDFLAGS="-L$DEPS_DIR/lib"

          OPTIMIZE="$OPTIMIZE" \
          CFLAGS="$CFLAGS" \
          LDFLAGS="$LDFLAGS" \
          make -C zapret -j"$(nproc)"

          test -f binaries/my/nfqws

          echo "===== BUILT NFQWS ====="
          file binaries/my/nfqws
          ls -lh binaries/my/nfqws

          echo "===== SHA256 ====="
          sha256sum binaries/my/nfqws

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp binaries/my/nfqws \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          "$TARGET-strip" \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo "===== FINAL FILE ====="
          file "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"
          ls -lh "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"
          sha256sum "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

      - name: Upload patched nfqws
        uses: actions/upload-artifact@v4
        with:
          name: nfqws-e5186-v72.13
          path: output/nfqws-e5186-v72.13
          if-no-files-found: error
