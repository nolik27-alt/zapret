name: E5186 NFQWS ARM test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build patched nfqws for Huawei E5186
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # DOWNLOAD OFFICIAL SOURCE
      # ========================================================

      - name: Download official zapret v72.13
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/src"

          wget -qO "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            "https://github.com/bol-van/zapret/archive/refs/tags/v72.13.tar.gz"

          tar -xzf \
            "$GITHUB_WORKSPACE/zapret-v72.13.tar.gz" \
            -C "$GITHUB_WORKSPACE/src"

          test -d \
            "$GITHUB_WORKSPACE/src/zapret-72.13"

          mv \
            "$GITHUB_WORKSPACE/src/zapret-72.13" \
            "$GITHUB_WORKSPACE/zapret"

          test -f \
            "$GITHUB_WORKSPACE/zapret/nfq/nfqws.c"

          echo "SOURCE OK"

      # ========================================================
      # PATCH
      # ========================================================

      - name: Patch nfqws for Huawei E5186
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("nfq/nfqws.c")
          s = p.read_text()

          needle = "nfq_unbind_pf(*h, AF_INET)"

          pos = s.find(needle)

          if pos < 0:
              raise SystemExit(
                  "ERROR: nfq_unbind_pf(*h, AF_INET) not found"
              )

          pattern = re.compile(
              r'''
              (?P<indent>^[ \t]*)
              if\s*\(\s*
              nfq_unbind_pf\(\*h,\s*AF_INET\)
              \s*<\s*0
              \s*\)
              \s*\{
              \s*
              DLOG_PERROR\("nfq_unbind_pf\(\)"\);
              \s*
              goto\s+exiterr;
              \s*
              \}
              ''',
              re.MULTILINE | re.VERBOSE
          )

          m = pattern.search(s)

          if not m:
              raise SystemExit(
                  "ERROR: nfq_unbind_pf error block not found"
              )

          i = m.group("indent")

          replacement = (
              f'{i}if (nfq_unbind_pf(*h, AF_INET) < 0) {{\n'
              f'{i}    if (errno == EINVAL) {{\n'
              f'{i}        DLOG("nfq_unbind_pf(): EINVAL, ignoring for old kernel\\n");\n'
              f'{i}    }} else {{\n'
              f'{i}        DLOG_PERROR("nfq_unbind_pf()");\n'
              f'{i}        goto exiterr;\n'
              f'{i}    }}\n'
              f'{i}}}'
          )

          p.write_text(
              s[:m.start()] +
              replacement +
              s[m.end():]
          )

          print("PATCH APPLIED")

          s2 = p.read_text()
          pos2 = s2.find(needle)

          print(
              s2[
                  max(0, pos2 - 250):
                  min(len(s2), pos2 + 850)
              ]
          )
          PY

      # ========================================================
      # TOOLCHAIN
      # ========================================================

      - name: Install ARM toolchain
        shell: bash
        run: |
          set -eux

          sudo apt-get update -qq
          sudo apt-get install -y \
            libcap-dev \
            wget \
            tar \
            xz-utils \
            bzip2

          TOOL="armv6-unknown-linux-musleabi"

          mkdir -p "$HOME/tools"

          wget -qO- \
            "https://github.com/bol-van/musl-cross/releases/download/latest/${TOOL}.tar.xz" \
            | tar \
              -C "$HOME/tools" \
              -xJ

          test -x \
            "$HOME/tools/$TOOL/bin/$TOOL-gcc"

          echo \
            "$HOME/tools/$TOOL/bin" \
            >> "$GITHUB_PATH"

          "$HOME/tools/$TOOL/bin/$TOOL-gcc" \
            --version

      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Build ARM dependencies
        shell: bash
        run: |
          set -eux

          DEPS="$GITHUB_WORKSPACE/deps"
          TARGET="armv6-unknown-linux-musleabi"
          CPU="-mcpu=arm1176jzf-s -mthumb"
          OPT="-Oz"

          mkdir -p \
            "$DEPS/include/sys" \
            "$DEPS/lib"

          cd "$GITHUB_WORKSPACE"

          echo "============================================================"
          echo " DOWNLOAD NETFILTER SOURCES"
          echo "============================================================"

          wget -qO- \
            "https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2" \
            | tar -xj

          wget -qO- \
            "https://www.netfilter.org/pub/libnfnetlink/libnfnetlink-1.0.2.tar.bz2" \
            | tar -xj

          wget -qO- \
            "https://www.netfilter.org/pub/libnetfilter_queue/libnetfilter_queue-1.0.5.tar.bz2" \
            | tar -xj

          echo ""
          echo "============================================================"
          echo " BUILD libmnl"
          echo "============================================================"

          (
            cd libmnl-1.0.5

            CC="$TARGET-gcc" \
            CFLAGS="$OPT $CPU" \
              ./configure \
                --host="$TARGET" \
                --prefix="$DEPS" \
                --enable-static \
                --disable-shared

            make -j"$(nproc)"
            make install
          )

          echo ""
          echo "============================================================"
          echo " BUILD libnfnetlink"
          echo "============================================================"

          (
            cd libnfnetlink-1.0.2

            CC="$TARGET-gcc" \
            CFLAGS="$OPT $CPU" \
              ./configure \
                --host="$TARGET" \
                --prefix="$DEPS" \
                --enable-static \
                --disable-shared

            make -j"$(nproc)"
            make install
          )

          echo ""
          echo "============================================================"
          echo " BUILD libnetfilter_queue"
          echo "============================================================"

          (
            cd libnetfilter_queue-1.0.5

            CC="$TARGET-gcc" \
            CPPFLAGS="-I$DEPS/include" \
            CFLAGS="$OPT $CPU -I$DEPS/include" \
            LDFLAGS="-L$DEPS/lib" \
            LIBMNL_CFLAGS="-I$DEPS/include" \
            LIBMNL_LIBS="-L$DEPS/lib -lmnl" \
            LIBNFNETLINK_CFLAGS="-I$DEPS/include" \
            LIBNFNETLINK_LIBS="-L$DEPS/lib -lnfnetlink" \
              ./configure \
                --host="$TARGET" \
                --prefix="$DEPS" \
                --enable-static \
                --disable-shared

            make -j"$(nproc)"
            make install
          )

          echo ""
          echo "============================================================"
          echo " DOWNLOAD REQUIRED SYSTEM HEADERS"
          echo "============================================================"

          wget -qO \
            "$DEPS/include/sys/queue.h" \
            "https://git.alpinelinux.org/aports/plain/main/bsd-compat-headers/queue.h"

          wget -qO \
            "$DEPS/include/sys/capability.h" \
            "https://git.kernel.org/pub/scm/libs/libcap/libcap.git/plain/libcap/include/sys/capability.h"

          test -s \
            "$DEPS/include/sys/queue.h"

          test -s \
            "$DEPS/include/sys/capability.h"

          echo ""
          echo "queue.h:"
          ls -lh \
            "$DEPS/include/sys/queue.h"

          echo ""
          echo "capability.h:"
          ls -lh \
            "$DEPS/include/sys/capability.h"

          echo ""
          echo "============================================================"
          echo " BUILD zlib"
          echo "============================================================"

          wget -qO- \
            "https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz" \
            | tar -xz

          (
            cd zlib-1.3.1

            CC="$TARGET-gcc" \
            CFLAGS="$OPT $CPU" \
              ./configure \
                --prefix="$DEPS" \
                --static

            make -j"$(nproc)"
            make install
          )

          echo ""
          echo "============================================================"
          echo " VERIFY ALL LIBRARIES"
          echo "============================================================"

          test -f "$DEPS/lib/libmnl.a"
          test -f "$DEPS/lib/libnfnetlink.a"
          test -f "$DEPS/lib/libnetfilter_queue.a"
          test -f "$DEPS/lib/libz.a"

          echo "libmnl:"
          ls -lh "$DEPS/lib/libmnl.a"

          echo "libnfnetlink:"
          ls -lh "$DEPS/lib/libnfnetlink.a"

          echo "libnetfilter_queue:"
          ls -lh "$DEPS/lib/libnetfilter_queue.a"

          echo "zlib:"
          ls -lh "$DEPS/lib/libz.a"

      # ========================================================
      # BUILD NFQWS
      # ========================================================
      - name: Install required system headers
        shell: bash
        run: |
          set -eux

          DEPS="$GITHUB_WORKSPACE/deps"

          mkdir -p "$DEPS/include/sys"

          install -Dm644 \
            /usr/include/x86_64-linux-gnu/sys/queue.h \
            "$DEPS/include/sys/queue.h"

          install -Dm644 \
            /usr/include/sys/capability.h \
            "$DEPS/include/sys/capability.h"

          test -f "$DEPS/include/sys/queue.h"
          test -f "$DEPS/include/sys/capability.h"

          echo "queue.h OK"
          echo "capability.h OK"
      - name: Build patched nfqws
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/zapret"

          TARGET="armv6-unknown-linux-musleabi"
          DEPS="$GITHUB_WORKSPACE/deps"
          CPU="-mcpu=arm1176jzf-s -mthumb"

          echo "============================================================"
          echo " VERIFY REQUIRED HEADERS"
          echo "============================================================"

          test -f \
            "$DEPS/include/sys/queue.h"

          test -f \
            "$DEPS/include/sys/capability.h"

          test -f \
            "$DEPS/include/libmnl/libmnl.h"

          test -f \
            "$DEPS/include/libnfnetlink/libnfnetlink.h"

          test -f \
            "$DEPS/include/libnetfilter_queue/libnetfilter_queue.h"

          echo "ALL HEADERS EXIST"

          echo ""
          echo "============================================================"
          echo " BUILD NFQWS"
          echo "============================================================"

          make -C nfq clean || true

          make -C nfq \
            CC="$TARGET-gcc" \
            AR="$TARGET-ar" \
            LD="$TARGET-ld" \
            NM="$TARGET-nm" \
            CFLAGS="-DZAPRET_GH_VER=v72.13-e5186 -static-libgcc -static $CPU -I$DEPS/include" \
            LDFLAGS="-L$DEPS/lib"

          test -f \
            nfq/nfqws

          echo ""
          echo "============================================================"
          echo " BUILT NFQWS"
          echo "============================================================"

          file nfq/nfqws

          ls -lh \
            nfq/nfqws

          echo ""
          echo "SHA256:"
          sha256sum \
            nfq/nfqws

          echo ""
          echo "============================================================"
          echo " CREATE OUTPUT"
          echo "============================================================"

          mkdir -p \
            "$GITHUB_WORKSPACE/output"

          cp \
            nfq/nfqws \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "FINAL FILE:"
          ls -lh \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "FINAL SHA256:"
          sha256sum \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

          echo ""
          echo "ELF HEADER:"
          "$TARGET-readelf" \
            -h \
            "$GITHUB_WORKSPACE/output/nfqws-e5186-v72.13"

      # ========================================================
      # UPLOAD
      # ========================================================

      - name: Upload patched nfqws
        uses: actions/upload-artifact@v4
        with:
          name: nfqws-e5186-v72.13
          path: output/nfqws-e5186-v72.13
          if-no-files-found: error
